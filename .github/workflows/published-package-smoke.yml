# Installs a published leaf-validator release in a clean project, discovers that
# version's public exports, imports each one through ESM and CommonJS, and
# annotates each export's size. Exports are listed in alphabetical order.
#
# The Build workflow calls this after its test jobs on pull requests and on
# pushes to master. It can also be run manually.

name: Published package

on:
  workflow_call:
    inputs:
      version:
        description: npm version or dist-tag (for example latest or 7.10.6)
        required: false
        default: latest
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: npm version or dist-tag (for example latest or 7.10.6)
        required: false
        default: latest
        type: string

jobs:
  smoke:
    name: Import published package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org/
      - name: Install and import the published package
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$PACKAGE_VERSION" =~ ^[A-Za-z0-9._+-]+$ ]]; then
            echo "Invalid npm version or dist-tag: $PACKAGE_VERSION"
            exit 1
          fi
          consumer="$RUNNER_TEMP/leaf-validator-consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          npm init -y
          npm install "leaf-validator@${PACKAGE_VERSION}" react react-dom esbuild
          cp "$GITHUB_WORKSPACE/scripts/published-package-smoke.mjs" ./published-package-smoke.mjs
          node ./published-package-smoke.mjs
